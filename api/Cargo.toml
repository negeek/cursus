[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { workspace = true }
actix-http = { workspace = true }
toasty = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
bcrypt = { workspace = true }
rand = { workspace = true }
jsonwebtoken = { workspace = true }
cron = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
# Needed to tell a unique constraint violation apart from any other database
# failure. Toasty surfaces the driver error underneath, so recognising the
# Postgres SQLSTATE means downcasting to the driver's own error type.
tokio-postgres = { workspace = true }
thiserror = { workspace = true }
# Already in the tree via actix-web. Named directly for `task_local!`, which the
# request event middleware uses to let any layer add context to the current
# request without it being passed down.
tokio = { workspace = true }

# Generating migration files is a development action, not something the server
# does, so the CLI and its argument parsing stay behind a feature flag and never
# reach the shipped binary. Applying migrations at runtime does not need this,
# that goes through embed_migrations! in the toasty crate itself.
toasty-cli = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[dev-dependencies]
tokio-postgres = { workspace = true }
url = { workspace = true }

[features]
cli = ["dep:toasty-cli", "dep:anyhow"]

[[bin]]
name = "migrator"
path = "src/bin/migrator.rs"
required-features = ["cli"]